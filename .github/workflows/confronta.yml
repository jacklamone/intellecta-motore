name: Confronta modelli AI

on:
  # Avvio manuale: rigiudica siti già valutati con modelli diversi (costa pochi centesimi)
  workflow_dispatch:
    inputs:
      modelli:
        description: "Modelli separati da virgola"
        required: false
        default: "gpt-6-luna,gpt-5-mini"
      quanti:
        description: "Quanti siti"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: confronta
  cancel-in-progress: false

jobs:
  confronta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # I dati stanno nel progetto privato: si scaricano in ./privato con il codice di accesso DATI_TOKEN
      - uses: actions/checkout@v4
        with:
          repository: jacklamone/intellecta-lead-finder
          token: ${{ secrets.DATI_TOKEN }}
          path: privato

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa
        run: pip install -r requirements.txt

      - name: Collega i dati del progetto privato
        run: .github/collega_dati.sh

      - name: Confronta
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: .github/esegui.sh python confronta_modelli.py --modelli "${{ inputs.modelli }}" --quanti "${{ inputs.quanti }}"

      - name: Salva il confronto
        if: always()
        run: .github/salva_dati.sh "Confronto modelli AI"
