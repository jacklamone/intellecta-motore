name: Crea anteprime e messaggi

on:
  # Avvio manuale: GitHub → Actions → "Crea anteprime e messaggi" → Run workflow
  workflow_dispatch:
    inputs:
      zona:
        description: "Zona già analizzata (es. CR)"
        required: true
      quante:
        description: "Quante anteprime creare (le migliori ancora senza)"
        required: false
        default: "15"

permissions:
  contents: read

concurrency:
  group: cerca
  cancel-in-progress: false

jobs:
  proposte:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # I dati stanno nel progetto privato: si scaricano in ./privato con il codice di accesso DATI_TOKEN
      - uses: actions/checkout@v4
        with:
          repository: jacklamone/intellecta-lead-finder
          token: ${{ secrets.DATI_TOKEN }}
          path: privato

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collega i dati del progetto privato
        run: .github/collega_dati.sh

      - name: Crea anteprime
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MODEL_PROPOSTE: ${{ vars.OPENAI_MODEL_PROPOSTE }}
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          ZONA: ${{ inputs.zona }}
          QUANTE: ${{ inputs.quante }}
        run: .github/esegui.sh python crea_proposte.py --zona "$ZONA" --max "$QUANTE"

      - name: Salva i risultati
        if: always()
        run: .github/salva_dati.sh "Anteprime e messaggi"
